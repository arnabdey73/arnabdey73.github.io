<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0;url=https://blog.arnabdey.dev/">
    <link rel="canonical" href="https://blog.arnabdey.dev/" />
    <meta name="description" content="Redirecting to Arnab Dey's technical blog" />
    <title>Redirecting to My Blog...</title>
    <style>
      body {
        font-family: 'Montserrat', sans-serif;
        background-color: #121212;
        color: #e6e6e6;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        text-align: center;
        overflow: hidden;
      }
      
      .container {
        padding: 2rem;
        border-radius: 12px;
        background-color: rgba(26, 26, 26, 0.8);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        max-width: 90%;
        width: 500px;
      }
      
      h1 {
        font-size: 1.8rem;
        margin-bottom: 1.5rem;
        color: #2a9df4;
      }
      
      p {
        font-size: 1.1rem;
        margin-bottom: 2rem;
        line-height: 1.6;
      }
      
      .loader {
        display: flex;
        justify-content: center;
        margin: 2rem 0;
      }
      
      .dot {
        width: 12px;
        height: 12px;
        margin: 0 6px;
        border-radius: 50%;
        background-color: #2a9df4;
        animation: pulse 1.5s infinite ease-in-out;
      }
      
      .dot:nth-child(2) {
        animation-delay: 0.2s;
      }
      
      .dot:nth-child(3) {
        animation-delay: 0.4s;
      }
      
      @keyframes pulse {
        0%, 100% {
          transform: scale(0.8);
          opacity: 0.6;
        }
        50% {
          transform: scale(1.2);
          opacity: 1;
        }
      }
      
      .redirect-link {
        color: #2a9df4;
        text-decoration: none;
        padding: 10px 20px;
        border: 2px solid #2a9df4;
        border-radius: 6px;
        font-weight: 500;
        transition: all 0.3s ease;
        display: inline-block;
        margin-top: 1rem;
      }
      
      .redirect-link:hover {
        background-color: #2a9df4;
        color: #121212;
        box-shadow: 0 0 15px rgba(42, 157, 244, 0.5);
      }
      
      .countdown {
        font-size: 1.2rem;
        font-weight: 500;
        margin-bottom: 1.5rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Redirecting to My Blog</h1>
      <p>If you are not redirected automatically, <a href="https://blog.arnabdey.dev/">click here</a>.</p>
      
      <div class="loader">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>
  </body>
</html>
