title: "Arnab Dey | Cloud Engineer Portfolio"
description: "Cloud Engineer with 14+ years of IT experience, specializing in DevOps, CI/CD, and Azure. Passionate about automation, infrastructure as code, and cloud-native solutions."

# Site Settings
url: "https://arnabdey73.github.io"
baseurl: ""
permalink: /:title/

# Author Information
author:
  name: "Arnab Dey"
  bio: "Cloud Engineer and DevOps specialist with 14+ years of IT experience"
  location: "Sweden"
  email: "mail@arnabdey.dev"
  linkedin: "arnabdey73"
  github: "arnabdey73"

# SEO Settings
logo: "/assets/img/avatar.jpg"
image: "/assets/img/portfolio-thumbnail.jpg"
lang: "en_US"

# Social Media
social:
  name: "Arnab Dey"
  links:
    - "https://www.linkedin.com/in/arnabdey73/"
    - "https://github.com/arnabdey73"

# Build Settings
markdown: kramdown
highlighter: rouge
sass:
  sass_dir: _sass
  style: compressed
  sourcemap: never

# Use a GitHub Pages supported theme
theme: minima

# Plugins - GitHub Pages supported
plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

# GitHub Pages specific settings
github: [metadata]

# Exclude files
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .bundle
  - .sass-cache
  - .jekyll-cache
  - .jekyll-metadata
  - package*.json
  - tailwind.config.js

# Navigation
header_pages:
  - content/about.md
  - content/projects.md
  - content/certifications.md
  - content/contact.md
