<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Devicon Simple Test</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #1a1a1a;
      color: white;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    .icon-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }
    .icon-box {
      background: rgba(0,0,0,0.2);
      padding: 15px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .icon-box i {
      font-size: 48px;
      margin-bottom: 10px;
    }
    h1 {
      margin-top: 0;
    }
    .status-panel {
      background: rgba(255,255,255,0.1);
      padding: 15px;
      border-radius: 8px;
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Devicon Simple Test</h1>
    <p>This page tests if the devicon library is loading correctly without any interference from other scripts.</p>
    
    <div class="icon-grid">
      <div class="icon-box">
        <i class="devicon-azure-plain colored"></i>
        <span>Azure</span>
      </div>
      <div class="icon-box">
        <i class="devicon-amazonwebservices-original colored"></i>
        <span>AWS</span>
      </div>
      <div class="icon-box">
        <i class="devicon-terraform-plain colored"></i>
        <span>Terraform</span>
      </div>
      <div class="icon-box">
        <i class="devicon-kubernetes-plain colored"></i>
        <span>Kubernetes</span>
      </div>
      <div class="icon-box">
        <i class="devicon-python-plain colored"></i>
        <span>Python</span>
      </div>
      <div class="icon-box">
        <i class="devicon-javascript-plain colored"></i>
        <span>JavaScript</span>
      </div>
    </div>
    
    <div class="status-panel">
      <h3>Status</h3>
      <div id="status">Checking...</div>
    </div>
  </div>
  
  <script>
    // Simple status check
    window.addEventListener('load', function() {
      const statusEl = document.getElementById('status');
      const icons = document.querySelectorAll('[class*="devicon-"]');
      
      if (icons.length > 0) {
        // Check if icons have computed styles
        const firstIcon = icons[0];
        const computedStyle = window.getComputedStyle(firstIcon);
        const fontFamily = computedStyle.fontFamily;
        
        if (fontFamily.toLowerCase().includes('devicon')) {
          statusEl.innerHTML = '✅ <strong>Success!</strong> Devicon CSS loaded properly and icons are displaying correctly.';
          statusEl.style.color = '#4CAF50';
        } else {
          statusEl.innerHTML = '⚠️ <strong>Partial success:</strong> Icons found in DOM but font may not be loading properly.';
          statusEl.style.color = '#FF9800';
        }
      } else {
        statusEl.innerHTML = '❌ <strong>Error:</strong> No devicon elements found in the DOM.';
        statusEl.style.color = '#F44336';
      }
    });
  </script>
</body>
</html>
