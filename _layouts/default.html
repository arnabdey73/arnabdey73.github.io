---
layout: default
---

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/19a52b3bff.js" crossorigin="anonymous"></script>
    <style>
      .margin-top-20 {
        margin-top: 20px;
      }
    </style>
</head>
<body>
  <header>
    {% if page.banner %}
      <div class="banner">
        <img src="{{ page.banner }}" alt="Banner Image" style="width: 100%; height: auto;">
      </div>
    {% endif %}
    {%- include header.html -%}
  </header>

  <div class="container">
    <aside class="sidebar">
      {%- include sidebar.html -%}
    </aside>

    <main class="content">
      {{ content }}
    </main>
  </div>

  <footer>
    {%- include footer.html -%}
  </footer>
</body>
</html>
