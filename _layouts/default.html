<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/19a52b3bff.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <img src="{{ '/assets/img/avatar.jpg' | relative_url }}" alt="Profile Photo" class="profile-pic">
      <h1 class="name">Arnab Dey</h1>
      <p class="caption">Cloud & DevOps Engineer</p>
      <div class="social-icons">
        <a href="https://github.com/arnabdey73"><i class="fab fa-github"></i></a>
        <a href="https://www.linkedin.com/in/arnabdey73/"><i class="fab fa-linkedin"></i></a>
        <a href="mailto:arnabdey009@gmail.com"><i class="fas fa-envelope"></i></a>
      </div>
      <div class="recent-posts">
        <h2>Recent Posts</h2>
        <ul>
          {% for post in site.posts limit:5 %}
            <li><a href="{{ post.url }}">{{ post.title }}</a></li>
          {% endfor %}
        </ul>
        <ul>
          <li><a href="#">Dummy Post 1</a></li>
          <li><a href="#">Dummy Post 2</a></li>
          <li><a href="#">Dummy Post 3</a></li>
        </ul>
      </div>
    </aside>

    <main class="content">
      {{ content }}
    </main>
  </div>
</body>
</html>
