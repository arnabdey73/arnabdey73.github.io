<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    
    <!-- Temporarily removed strict CSP for testing -->
    <meta name="referrer" content="strict-origin-when-cross-origin">
    
    <!-- Primary Meta Tags -->
    <title>{% if page.title %}{{ page.title | escape }} | {{ site.title | escape }}{% else %}{{ site.title | escape }}{% endif %}</title>
    <meta name="title" content="{% if page.title %}{{ page.title | escape }} | {{ site.title | escape }}{% else %}{{ site.title | escape }}{% endif %}">
    <meta name="description" content="{% if page.description %}{{ page.description | strip_html | normalize_whitespace | truncate: 160 | escape }}{% else %}{{ site.description }}{% endif %}">
    <meta name="author" content="{% if page.author %}{{ page.author }}{% else %}{{ site.author.name }}{% endif %}">
    <meta name="keywords" content="{% if page.keywords %}{{ page.keywords }}{% else %}cloud engineer, devops, azure, infrastructure as code, automation{% endif %}">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:title" content="{% if page.title %}{{ page.title | escape }} | {{ site.title | escape }}{% else %}{{ site.title | escape }}{% endif %}">
    <meta property="og:description" content="{% if page.description %}{{ page.description | strip_html | normalize_whitespace | truncate: 160 | escape }}{% else %}{{ site.description }}{% endif %}">
    <meta property="og:image" content="{% if page.image %}{{ page.image | absolute_url }}{% else %}{{ site.image | absolute_url }}{% endif %}">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="{{ page.url | absolute_url }}">
    <meta property="twitter:title" content="{% if page.title %}{{ page.title | escape }} | {{ site.title | escape }}{% else %}{{ site.title | escape }}{% endif %}">
    <meta property="twitter:description" content="{% if page.description %}{{ page.description | strip_html | normalize_whitespace | truncate: 160 | escape }}{% else %}{{ site.description }}{% endif %}">
    <meta property="twitter:image" content="{% if page.image %}{{ page.image | absolute_url }}{% else %}{{ site.image | absolute_url }}{% endif %}">
      <!-- Canonical -->
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{{ '/assets/img/favicon.ico' | relative_url }}">
    
    <!-- Jekyll SEO tag -->
    {% seo title=false %}
    
    <!-- Resource hints for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="dns-prefetch" href="https://www.googletagmanager.com">
    
    <!-- Critical CSS - load immediately -->
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    
    <!-- Consolidated CSS files for better performance -->
    <link rel="stylesheet" href="{{ '/assets/css/layout.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}" media="print" onload="this.media='all'; this.onload=null;">
    <link rel="stylesheet" href="{{ '/assets/css/components.css' | relative_url }}" media="print" onload="this.media='all'; this.onload=null;">
    <link rel="stylesheet" href="{{ '/assets/css/icons.css' | relative_url }}" media="print" onload="this.media='all'; this.onload=null;">
    
    <!-- External resources with performance optimizations -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-Avb2QiuDEEvB4bZJYdft2mNjVShBftLdPG8FJ0V7irTLQ8Uo0qcPxh4Plq7G5tGm0rU+1SPhVotteLpBERwTkw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" crossorigin>
    
    <!-- Fallback for browsers that don't support onload -->
    <noscript>
      <link rel="stylesheet" href="{{ '/assets/css/layout.css' | relative_url }}">
      <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">
      <link rel="stylesheet" href="{{ '/assets/css/components.css' | relative_url }}">
      <link rel="stylesheet" href="{{ '/assets/css/icons.css' | relative_url }}">
    </noscript>    
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-RPGTPYDW80"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-RPGTPYDW80');
    </script>
    
    <!-- Structured Data for SEO -->
    {% include structured-data.html %}
</head>
<body class="theme-initializing">
  <header>
    <nav>
        {% include header.html %} <!-- Navigation bar -->
    </nav>
  </header>
  
  <!-- Mobile nav-container between header strip and content -->
  <div class="mobile-nav-container">
    {% include mobile-nav-buttons.html %}
  </div>
  
  <main class="content">
    <div class="content-wrapper">
      {% if page.url contains '/about/' and page.title %}
        <h1 class="page-title">{{ page.title }}</h1>
      {% endif %}
      {{ content }} <!-- Main content area -->
    </div>
  </main>
  <footer>
    {% include footer.html %} <!-- Footer section -->
  </footer>
  <!-- Back to top button with improved accessibility -->
  <button id="back-to-top-btn" title="Go to top" aria-label="Scroll back to top of page">
    <i class="fas fa-arrow-up" aria-hidden="true"></i>
    <span class="sr-only">Back to top</span>
  </button>  <!-- Use minified, bundled JS for better performance -->
  <script src="{{ '/assets/js/min/bundle.min.js' | relative_url }}"></script>
      <!-- Script for back to top button functionality and mobile navigation -->  
  <script>
    // Show/hide the mobile nav container based on screen width
    function updateMobileNavContainer() {
      var mobileNav = document.querySelector('.mobile-nav-container');
      if (window.innerWidth <= 768) {
        mobileNav.style.display = 'flex';
      } else {
        mobileNav.style.display = 'none';
      }
    }
    
    // Initialize mobile nav on page load
    document.addEventListener('DOMContentLoaded', function() {
      updateMobileNavContainer();
    });
    
    // Update mobile nav on window resize
    window.addEventListener('resize', updateMobileNavContainer);
    
    // Get the back to top button with defensive coding
    let backToTopButton = document.getElementById("back-to-top-btn");
    
    // If the button doesn't exist for some reason (rare case), create it dynamically
    if (!backToTopButton) {
      backToTopButton = document.createElement('button');
      backToTopButton.id = 'back-to-top-btn';
      backToTopButton.title = 'Go to top';
      backToTopButton.setAttribute('aria-label', 'Scroll back to top of page');
      backToTopButton.innerHTML = '<i class="fas fa-arrow-up" aria-hidden="true"></i><span class="sr-only">Back to top</span>';
      document.body.appendChild(backToTopButton);
    }
    
    // When the user scrolls down 300px from the top of the document, show the button
    window.onscroll = function() {scrollFunction()};
    
    function scrollFunction() {
      if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
        backToTopButton.style.display = "flex";
        backToTopButton.classList.add("show");
        
        // Add a slight animation effect for better visibility
        setTimeout(() => {
          backToTopButton.style.transform = "scale(1)";
          backToTopButton.style.opacity = "1";
        }, 10);
      } else {
        // Fade out with animation
        backToTopButton.style.transform = "scale(0.9)";
        backToTopButton.style.opacity = "0";
        
        setTimeout(() => {
          backToTopButton.style.display = "none";
          backToTopButton.classList.remove("show");
        }, 300);
      }
    }
    
    // When the user clicks on the button, scroll to the top of the document
    backToTopButton.addEventListener("click", function() {
      // Smooth scroll behavior
      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });
      
      // Add smooth scrolling
      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });    });
    
    // Ensure button appears on iOS and mobile devices
    document.addEventListener('DOMContentLoaded', function() {
      // Force check on page load after a slight delay
      setTimeout(function() {
        scrollFunction();
      }, 500);
      
      // Also check when page is fully loaded (including images)
      window.addEventListener('load', function() {
        scrollFunction();
      });
      
      // Additional check for touchscreen devices
      if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
        // Ensure button has proper touch area
        backToTopButton.style.minHeight = '44px';
        backToTopButton.style.minWidth = '44px';
      }
    });
  </script>
</body>
</html>
