---
layout: default
---

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ page.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-Avb2QiuDEEvB4bZJYdft2mNjVShBftLdPG8FJ0V7irTLQ8Uo0qcPxh4Plq7G5tGm0rU+1SPhVotteLpBERwTkw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Google Tag Manager -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-RPGTPYDW80" onerror="console.error('Google Tag Manager script failed to load.')"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-RPGTPYDW80');
    </script>
    <!-- End Google Tag Manager -->
</head>
<body>
  <header>
    <nav>
        {% include header.html %} <!-- Navigation bar -->
    </nav>
  </header>
  <main class="content">
    <div class="content-wrapper">
      {{ content }} <!-- Main content area -->
    </div>
  </main>
  <footer>
    {% include footer.html %} <!-- Footer section -->
  </footer>

  <!-- Back to top button -->
  <button id="back-to-top-btn" title="Go to top">
    <i class="fas fa-arrow-up"></i>
  </button>

  <!-- Script for back to top button functionality -->
  <script>
    // Get the button
    const backToTopButton = document.getElementById("back-to-top-btn");
    
    // When the user scrolls down 300px from the top of the document, show the button
    window.onscroll = function() {scrollFunction()};
    
    function scrollFunction() {
      if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
        backToTopButton.style.display = "flex";
      } else {
        backToTopButton.style.display = "none";
      }
    }
    
    // When the user clicks on the button, scroll to the top of the document
    backToTopButton.addEventListener("click", function() {
      document.body.scrollTop = 0; // For Safari
      document.documentElement.scrollTop = 0; // For Chrome, Firefox, IE and Opera
      
      // Add smooth scrolling
      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });
    });
  </script>
</body>
</html>
