<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/19a52b3bff.js" crossorigin="anonymous"></script>
</head>
<body>
  <main class="main-content">
    <!-- Top Navigation Bar -->
    <nav class="w-full flex justify-center gap-10 py-4 bg-[#36221c] text-white text-lg font-medium sticky top-0 z-50 shadow-md">
      <a href="#about" class="hover:text-orange-400 transition">About</a>
      <a href="#certifications" class="hover:text-orange-400 transition">Certifications</a>
      <a href="#projects" class="hover:text-orange-400 transition">Projects</a>
      <a href="#contact" class="hover:text-orange-400 transition">Contact</a>
    </nav>


    <section class="banner">

    </section>

    <aside class="sidebar">
      <img src="{{ '/assets/img/avatar.jpg' | relative_url }}" alt="Profile Photo" class="profile-pic">
      <h1 class="name">Arnab Dey</h1>
      <p class="caption">Cloud & DevOps Engineer</p>
      <div class="social-icons">
        <a href="https://github.com/arnabdey73"><i class="fab fa-github"></i></a>
        <a href="https://www.linkedin.com/in/arnabdey73/"><i class="fab fa-linkedin"></i></a>
        <a href="mailto:arnabdey009@gmail.com"><i class="fas fa-envelope"></i></a>
        <a href="https://bsky.app/profile/arnabdey73.bsky.social"><i class="fab fa-bluesky"></i></a>
      </div>
      <button class="cta" onclick="window.location.href='https://github.com/arnabdey73/resume/raw/main/Arnab_Dey_Resume.pdf'">
        Download Resume
      </button>
      <div style="margin-top: 20px;"></div>
      <div class="recent-posts">
        <h2>Recent Posts</h2>
        <ul>
          {% for post in site.posts limit:5 %}
            <li><a href="{{ post.url }}">{{ post.title }}</a></li>
          {% endfor %}
        </ul>
        <ul>
          <li><a href="https://codemyinfra.hashnode.dev/a-complete-devops-automation-project-with-python-azure-and-kubernetes">DevOps Automation Project</a></li>
          <li><a href="#">Dummy Post 2</a></li>
          <li><a href="#">Dummy Post 3</a></li>
        </ul>
      </div>
      <!-- <div class="projects">
        <h2>Projects</h2>
        <ul>
          <li><a href="https://github.com/arnabdey73/devops-python-automation-project">Cloud Infrastructure Automation</a></li>
          <li><a href="https://github.com/arnabdey73/personal-expense-tracker">Personal Expense Tracker (PCEP)</a></li>
          <li><a href="https://github.com/arnabdey73/triforce-first">Triforce Implementation</a></li>
        </ul>
      </div> -->
    </aside>

    <main class="content">
      {{ content }}
    </main>
  </div>
</body>
</html>
