<script>
// Show/hide the mobile nav container based on screen width
function updateMobileNavContainer() {
  var mobileNav = document.querySelector('.mobile-nav-container');
  if (window.innerWidth <= 768) {
    mobileNav.style.display = 'flex';
  } else {
    mobileNav.style.display = 'none';
  }
}

// Initialize on page load and handle resize events
document.addEventListener('DOMContentLoaded', function() {
  updateMobileNavContainer();
  
  // Make sure mobile theme toggle and the main theme toggle stay in sync
  const mainThemeToggle = document.getElementById('theme-toggle');
  const mobileThemeToggle = document.getElementById('theme-toggle-mobile');
  
  if (mainThemeToggle && mobileThemeToggle) {
    // Sync the initial state
    const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', currentTheme);
  }
});

window.addEventListener('resize', updateMobileNavContainer);
</script>
