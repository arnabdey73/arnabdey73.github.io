<!-- Mobile nav buttons: menu and theme toggle, for use below the intro card on mobile only -->
<div class="nav-container" style="width:100%;justify-content:center;gap:1rem;z-index:1001;">
  <button class="theme-toggle" id="theme-toggle-mobile" aria-label="Toggle light/dark theme" title="Toggle theme">
    <i class="fas fa-sun light-icon" aria-hidden="true"></i>
    <i class="fas fa-moon dark-icon" aria-hidden="true"></i>
    <span class="sr-only">Toggle theme</span>
  </button>
  <button class="menu-toggle" id="menu-toggle-mobile" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="nav-menu" title="Open site navigation">
    <i class="fas fa-bars"></i>
    <span class="sr-only">Menu</span>
  </button>
</div>
<script>
// Mobile theme toggle
const themeToggleMobile = document.getElementById('theme-toggle-mobile');
if (themeToggleMobile) {
  themeToggleMobile.addEventListener('click', function() {
    const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', newTheme);
    localStorage.setItem('theme', newTheme);
  });
}
// Mobile menu toggle (scrolls to nav)
const menuToggleMobile = document.getElementById('menu-toggle-mobile');
if (menuToggleMobile) {
  menuToggleMobile.addEventListener('click', function() {
    const nav = document.querySelector('.top-nav');
    if (nav) nav.scrollIntoView({behavior:'smooth'});
  });
}
</script>
