<!-- Load mobile navigation script -->
<script src="{{ '/assets/js/mobile-nav.js' | relative_url }}"></script>

<script>
  // Mobile menu toggle and active page functionality
  document.addEventListener('DOMContentLoaded', function() {
    const menuToggle = document.querySelector('.menu-toggle');
    const navMenu = document.getElementById('nav-menu');
    
    // Add initial-load class to trigger the animation on page load
    // Only on mobile devices
    if (window.innerWidth <= 768 && menuToggle) {
      // Add a slight delay before animation starts to ensure it's noticed
      setTimeout(() => {
        menuToggle.classList.add('initial-load');
        
        // Add an extra flash effect to draw more attention to the button
        menuToggle.style.backgroundColor = 'rgba(0, 120, 212, 0.8)';
        setTimeout(() => {
          menuToggle.style.backgroundColor = 'rgba(0, 120, 212, 0.4)';
        }, 300);
        
        // Remove the class after animation completes
        setTimeout(() => {
          menuToggle.classList.remove('initial-load');
        }, 3000);
      }, 500);
    }
    
    // Set active page
    const currentPath = window.location.pathname;
    const navLinks = document.querySelectorAll('#nav-menu a');
    
    navLinks.forEach(link => {
      const linkPath = link.getAttribute('href');
      if (linkPath === currentPath || (linkPath !== '/' && currentPath.startsWith(linkPath))) {
        link.classList.add('active');
      }
    });
    
    // Mobile menu toggle
    if (menuToggle && navMenu) {
      menuToggle.addEventListener('click', function(event) {
        // Toggle menu visibility
        navMenu.classList.toggle('show');
        
        // Toggle active class on button
        this.classList.toggle('active');
        
        // Toggle between menu and close icon
        const isExpanded = navMenu.classList.contains('show');
        this.setAttribute('aria-expanded', isExpanded);
        
        // Enhanced icon transition with dynamic rotation
        const iconElement = this.querySelector('i');
        
        if (isExpanded) {
          // First prep for animation with CSS transform
          iconElement.style.transition = 'transform 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55), opacity 0.2s ease';
          
          // Start rotation animation and fade out
          iconElement.style.transform = 'rotate(180deg)';
          iconElement.style.opacity = '0';
          
          // Wait for animation to progress then swap icons
          setTimeout(() => {
            iconElement.classList.remove('fa-bars');
            iconElement.classList.add('fa-times'); // Change to X when menu is open
            iconElement.style.transform = 'rotate(0)';
            iconElement.style.opacity = '1';
          }, 200);
          
          // Update tooltip
          this.setAttribute('title', 'Close site navigation');
        } else {
          // First prep for animation with CSS transform
          iconElement.style.transition = 'transform 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55), opacity 0.2s ease';
          
          // Start rotation animation and fade out
          iconElement.style.transform = 'rotate(-180deg)';
          iconElement.style.opacity = '0';
          
          // Wait for animation to progress then swap icons
          setTimeout(() => {
            iconElement.classList.remove('fa-times');
            iconElement.classList.add('fa-bars'); // Change back to bars when menu is closed
            iconElement.style.transform = 'rotate(0)';
            iconElement.style.opacity = '1';
          }, 200);
          
          // Update tooltip
          this.setAttribute('title', 'Open site navigation');
        }
        
        event.stopPropagation(); // Prevent document click from immediately closing it
      });
      
      // Close menu when clicking outside
      document.addEventListener('click', function(event) {
        if (!event.target.closest('.top-nav') || event.target.tagName === 'A') {
          navMenu.classList.remove('show');
          menuToggle.classList.remove('active');
          menuToggle.setAttribute('aria-expanded', 'false');
          
          // Reset icon with enhanced animation
          const iconElement = menuToggle.querySelector('i');
          
          // First prep for animation with CSS transform
          iconElement.style.transition = 'transform 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55), opacity 0.2s ease';
          
          // Start rotation animation and fade out
          iconElement.style.transform = 'rotate(-180deg)';
          iconElement.style.opacity = '0';
          
          // Wait for animation to progress then swap icons
          setTimeout(() => {
            iconElement.classList.remove('fa-times');
            iconElement.classList.add('fa-bars'); // Change back to bars when menu is closed
            iconElement.style.transform = 'rotate(0)';
            iconElement.style.opacity = '1';
          }, 200);
          
          // Update tooltip
          menuToggle.setAttribute('title', 'Open site navigation');
        }
      });
      
      // Close menu on window resize (if switching from mobile to desktop)
      window.addEventListener('resize', function() {
        if (window.innerWidth > 768) {
          navMenu.classList.remove('show');
          menuToggle.classList.remove('active');
          menuToggle.setAttribute('aria-expanded', 'false');
          
          // Reset icon
          const iconElement = menuToggle.querySelector('i');
          iconElement.classList.remove('fa-times');
          iconElement.classList.add('fa-bars');
        }
      });
    }
  });
</script>
