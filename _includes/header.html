<script>
  // Add initial animation for menu button
  document.addEventListener('DOMContentLoaded', function() {
    const menuToggle = document.querySelector('.menu-toggle');
    
    // Add initial-load class to trigger the animation on page load
    // Only on mobile devices
    if (window.innerWidth <= 768 && menuToggle) {
      // Add a slight delay before animation starts to ensure it's noticed
      setTimeout(() => {
        menuToggle.classList.add('initial-load');
        
        // Remove the class after animation completes
        setTimeout(() => {
          menuToggle.classList.remove('initial-load');
        }, 3000);
      }, 500);
    }
  });
</script>
