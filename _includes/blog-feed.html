<div class="blog-feed-section" id="blog-feed">
  <div class="container">
    <h2 class="section-title">Latest Blog Posts</h2>
    <p class="section-subtitle">Recent articles from my technical blog</p>
    
    <div class="blog-posts">
      <!-- Blog posts will be loaded dynamically via JavaScript -->
      <div class="posts-container" id="blog-posts-container">
        <div class="loading-spinner">
          <div class="spinner"></div>
          <p>Loading latest posts...</p>
        </div>
      </div>
    </div>
    <div class="blog-cta">
      <a href="https://astro-paper-project.vercel.app" target="_blank" rel="noopener" class="blog-btn">
        <i class="fas fa-book-open"></i>
        Visit Blog Section
      </a>
    </div>
  </div>
</div>

<!-- RSS-based Blog fetch script -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    fetchBlogPostsFromRSS();
  });

  async function fetchBlogPostsFromRSS() {
    const container = document.getElementById('blog-posts-container');
    const rssUrl = 'https://astro-paper-project.vercel.app/rss.xml';
    const corsProxy = 'https://api.allorigins.win/raw?url=';
    
    try {
      // Show loading state
      container.innerHTML = `
        <div class="loading-spinner">
          <div class="spinner"></div>
          <p>Loading latest posts...</p>
        </div>
      `;
      
      // Try direct RSS fetch first, then use CORS proxy if needed
      let response;
      try {
        response = await fetch(rssUrl, {
          method: 'GET',
          headers: {
            'Accept': 'application/rss+xml, application/xml, text/xml',
            'User-Agent': 'Mozilla/5.0 Portfolio Website'
          },
          cache: 'no-cache'
        });
        
        if (!response.ok) {
          throw new Error('Direct fetch failed');
        }
      } catch (directError) {
        console.log('Direct RSS fetch failed, trying CORS proxy...');
        response = await fetch(corsProxy + encodeURIComponent(rssUrl), {
          method: 'GET',
          headers: {
            'Accept': 'application/rss+xml, application/xml, text/xml'
          },
          cache: 'no-cache'
        });
      }
      
      if (!response.ok) {
        throw new Error(`Failed to fetch RSS (${response.status}): ${response.statusText}`);
      }
      
      const xmlText = await response.text();
      
      // Parse RSS XML
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlText, 'application/xml');
      
      // Check for parsing errors
      const parseError = xmlDoc.querySelector('parsererror');
      if (parseError) {
        throw new Error('Failed to parse RSS XML');
      }
      
      // Extract RSS items
      const items = xmlDoc.querySelectorAll('item');
      
      // Clear loading spinner
      container.innerHTML = '';
        // Get top 3 posts
      const postsToShow = Math.min(items.length, 3);
      
      if (postsToShow === 0) {
        console.log('No posts found in RSS feed');
        return displayFallbackPosts(container);
      }
      
      // Process each post
      for (let i = 0; i < postsToShow; i++) {
        parseRSSItem(items[i], container);
      }
      
    } catch (error) {
      console.error('Error fetching blog posts:', error);
      displayFallbackPosts(container, error.message);
    }
  }

  function parseRSSItem(item, container) {
    // Extract data from RSS item
    const title = item.querySelector('title')?.textContent?.trim() || 'Blog Post';
    const link = item.querySelector('link')?.textContent?.trim() || item.querySelector('guid')?.textContent?.trim() || '#';
    const description = item.querySelector('description')?.textContent?.trim() || 'Read this blog post about cloud engineering and DevOps practices.';
    const pubDate = item.querySelector('pubDate')?.textContent?.trim();
    
    // Format date
    let formattedDate = '';
    if (pubDate) {
      try {
        const date = new Date(pubDate);
        formattedDate = date.toLocaleDateString('en-US', { 
          year: 'numeric', 
          month: 'long', 
          day: 'numeric' 
        });
      } catch (e) {
        formattedDate = pubDate;
      }
    }
    
    // Clean description (remove HTML tags and limit length)
    const cleanDescription = description
      .replace(/<[^>]*>/g, '') // Remove HTML tags
      .replace(/\s+/g, ' ')    // Normalize whitespace
      .trim()
      .substring(0, 150) + (description.length > 150 ? '...' : '');
    
    // Determine post image based on title keywords
    let postImage = '/assets/img/blog-placeholder.jpg';
    const titleLower = title.toLowerCase();
    
    if (titleLower.includes('devops') || titleLower.includes('automation')) {
      postImage = 'https://images.unsplash.com/photo-1667372393119-3d4c48d07fc9?w=400&h=200&fit=crop&auto=format';
    } else if (titleLower.includes('azure') || titleLower.includes('cloud')) {
      postImage = 'https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=400&h=200&fit=crop&auto=format';
    } else if (titleLower.includes('terraform') || titleLower.includes('iac') || titleLower.includes('infrastructure')) {
      postImage = 'https://images.unsplash.com/photo-1558494949-ef010cbdcc31?w=400&h=200&fit=crop&auto=format';
    } else if (titleLower.includes('kubernetes') || titleLower.includes('k8s')) {
      postImage = 'https://images.unsplash.com/photo-1667372335962-5fd503a8ae5b?w=400&h=200&fit=crop&auto=format';
    } else if (titleLower.includes('python') || titleLower.includes('programming')) {
      postImage = 'https://images.unsplash.com/photo-1515879218367-8466d910aaa4?w=400&h=200&fit=crop&auto=format';
    } else if (titleLower.includes('openstack')) {
      postImage = 'https://images.unsplash.com/photo-1518709268805-4e9042af2176?w=400&h=200&fit=crop&auto=format';
    }
    
    // Create post card
    createPostCard(container, {
      title,
      link,
      description: cleanDescription,
      date: formattedDate,
      imgSrc: postImage
    });
  }

  function displayFallbackPosts(container, errorMessage = null) {
    // Show the actual recent posts as fallback with real data from RSS
    container.innerHTML = `
      <div class="blog-post-card">
        <div class="post-image">
          <a href="https://astro-paper-project.vercel.app/posts/a-complete-devops-automation-project-with-python-azure-and-kubernetes/" target="_blank" rel="noopener">
            <img src="https://images.unsplash.com/photo-1667372393119-3d4c48d07fc9?w=400&h=200&fit=crop&auto=format" alt="DevOps Automation" loading="lazy" 
              onerror="this.onerror=null; this.src='/assets/img/blog-placeholder.jpg';">
          </a>
        </div>
        <div class="post-content">
          <h3><a href="https://astro-paper-project.vercel.app/posts/a-complete-devops-automation-project-with-python-azure-and-kubernetes/" target="_blank" rel="noopener">🚀 A Complete DevOps Automation Project with Python, Azure, and Kubernetes</a></h3>
          <p>A comprehensive DevOps portfolio project that demonstrates automation, infrastructure as code, CI/CD, and Kubernetes deployment using Python, Azure, and modern DevOps tools.</p>
          <div class="post-meta">
            <span class="date"><i class="far fa-calendar-alt"></i> May 26, 2025</span>
            <a href="https://astro-paper-project.vercel.app/posts/a-complete-devops-automation-project-with-python-azure-and-kubernetes/" target="_blank" rel="noopener" class="read-more">Read More →</a>
          </div>
        </div>
      </div>
      
      <div class="blog-post-card">
        <div class="post-image">
          <a href="https://astro-paper-project.vercel.app/posts/a-guide-to-automating-cost-savings-on-azure-with-python-terraform-and-azure-devops/" target="_blank" rel="noopener">
            <img src="https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=400&h=200&fit=crop&auto=format" alt="Azure Cost Optimization" loading="lazy" 
              onerror="this.onerror=null; this.src='/assets/img/blog-placeholder.jpg';">
          </a>
        </div>
        <div class="post-content">
          <h3><a href="https://astro-paper-project.vercel.app/posts/a-guide-to-automating-cost-savings-on-azure-with-python-terraform-and-azure-devops/" target="_blank" rel="noopener">💰 A Guide to Automating Cost Savings on Azure with Python, Terraform & Azure DevOps</a></h3>
          <p>Learn how to build a Python-based cost optimizer for Azure that automatically identifies cost-saving opportunities using Terraform and Azure DevOps pipelines.</p>
          <div class="post-meta">
            <span class="date"><i class="far fa-calendar-alt"></i> May 26, 2025</span>
            <a href="https://astro-paper-project.vercel.app/posts/a-guide-to-automating-cost-savings-on-azure-with-python-terraform-and-azure-devops/" target="_blank" rel="noopener" class="read-more">Read More →</a>
          </div>
        </div>
      </div>

      <div class="blog-post-card">
        <div class="post-image">
          <a href="https://astro-paper-project.vercel.app/posts/iac-azure-core-governance-enterprise-scale-automation-platform/" target="_blank" rel="noopener">
            <img src="https://images.unsplash.com/photo-1558494949-ef010cbdcc31?w=400&h=200&fit=crop&auto=format" alt="Infrastructure as Code" loading="lazy" 
              onerror="this.onerror=null; this.src='/assets/img/blog-placeholder.jpg';">
          </a>
        </div>
        <div class="post-content">
          <h3><a href="https://astro-paper-project.vercel.app/posts/iac-azure-core-governance-enterprise-scale-automation-platform/" target="_blank" rel="noopener">🏗️ IAC Azure Core Governance: Enterprise-Scale Foundation for Cloud Compliance</a></h3>
          <p>Discover a comprehensive Infrastructure as Code solution that implements Azure governance at enterprise scale with management groups, policy assignments, RBAC, and security controls using Terraform.</p>
          <div class="post-meta">
            <span class="date"><i class="far fa-calendar-alt"></i> May 20, 2025</span>
            <a href="https://astro-paper-project.vercel.app/posts/iac-azure-core-governance-enterprise-scale-automation-platform/" target="_blank" rel="noopener" class="read-more">Read More →</a>
          </div>
        </div>
      </div>

      <div class="blog-post-card">
        <div class="post-image">
          <a href="https://astro-paper-project.vercel.app/posts/openstack-devops-suite-comprehensive-automation-platform/" target="_blank" rel="noopener">
            <img src="https://images.unsplash.com/photo-1518709268805-4e9042af2176?w=400&h=200&fit=crop&auto=format" alt="OpenStack DevOps" loading="lazy" 
              onerror="this.onerror=null; this.src='/assets/img/blog-placeholder.jpg';">
          </a>
        </div>
        <div class="post-content">
          <h3><a href="https://astro-paper-project.vercel.app/posts/openstack-devops-suite-comprehensive-automation-platform/" target="_blank" rel="noopener">🔄 OpenStack DevOps Suite: A Comprehensive Automation Platform for Modern Infrastructure</a></h3>
          <p>Discover the OpenStack DevOps Suite - a powerful, open-source automation platform that streamlines infrastructure management, deployment pipelines, and monitoring for modern cloud environments.</p>
          <div class="post-meta">
            <span class="date"><i class="far fa-calendar-alt"></i> May 1, 2025</span>
            <a href="https://astro-paper-project.vercel.app/posts/openstack-devops-suite-comprehensive-automation-platform/" target="_blank" rel="noopener" class="read-more">Read More →</a>
          </div>
        </div>
      </div>
      
      ${errorMessage ? `
      <div class="blog-post-card error-notice">
        <div class="post-content">
          <p class="error-message"><small><i class="fas fa-info-circle"></i> Note: Showing cached posts. Live feed temporarily unavailable: ${errorMessage}</small></p>
        </div>
      </div>
      ` : ''}
    `;
  }

  function createPostCard(container, post) {
    const postCard = document.createElement('div');
    postCard.className = 'blog-post-card';
    
    postCard.innerHTML = `
      <div class="post-image">
        <a href="${post.link}" target="_blank" rel="noopener">
          <img src="${post.imgSrc}" alt="${post.title}" loading="lazy" 
            onerror="this.onerror=null; this.src='/assets/img/blog-placeholder.jpg'; this.classList.add('placeholder-img');">
        </a>
      </div>
      <div class="post-content">
        <h3><a href="${post.link}" target="_blank" rel="noopener">${post.title}</a></h3>
        <p>${post.description}</p>
        <div class="post-meta">
          ${post.date ? `<span class="date"><i class="far fa-calendar-alt"></i> ${post.date}</span>` : ''}
          <a href="${post.link}" target="_blank" rel="noopener" class="read-more">Read More →</a>
        </div>
      </div>
    `;
    
    container.appendChild(postCard);
  }
</script>
